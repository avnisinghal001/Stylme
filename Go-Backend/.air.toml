root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/stylme-go ./cmd/api"
entrypoint = ["./tmp/stylme-go"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[screen]
clear_on_rebuild = false
keep_scroll = true
